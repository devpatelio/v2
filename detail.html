<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Details • Dev Patel</title>

  <!-- fonts / styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="light-theme">
  <!-- top nav (identical to other pages) -->
  <nav class="top-nav" id="topNav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="index.html" class="logo-link">
          <div class="logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="12" cy="12" r="3" fill="currentColor"/>
            </svg>
          </div>
          <span class="logo-text">Dev Patel</span>
        </a>
      </div>

      <div class="nav-center">
        <!-- Mini carousel in nav bar -->
        <div class="nav-carousel" id="navCarousel">
          <div class="nav-carousel-container">
            <div class="nav-carousel-image" id="navCarouselImage">
              <!-- Nav carousel image -->
            </div>
          </div>
        </div>
        
        <div class="nav-links">
          <a href="index.html"          class="nav-link">Home</a>
          <a href="projects.html"       class="nav-link">Projects</a>
          <a href="index.html#about"    class="nav-link">About</a>
          <a href="index.html#contact"  class="nav-link">Contact</a>
        </div>
      </div>

      <div class="nav-right">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
          <svg class="sun-icon"  width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.5" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- DETAILS CONTENT -->
  <div class="project-page active" id="detailRoot">
    <!-- JS will inject everything here -->
  </div>

  <!-- ----------  DATA + LOGIC  ---------- -->
  <script src="script.js"></script>   <!-- brings in projects[] + experiences[] + helpers -->
  <script>
    /* ---------- utilities ---------- */
    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }
    function buildSection(sec) {
      return `
        <section class="section" id="${sec.id}">
          <h2 class="section-title">${sec.title}</h2>
          <div class="section-content">${sec.content}</div>
        </section>
      `;
    }

    /* ---------- page bootstrap ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();          // from script.js

      document.getElementById('themeToggle')
              ?.addEventListener('click', toggleTheme);

      const type = qs('type');         // project | experience
      const id   = qs('id');
      if (!type || !id) {
        document.getElementById('detailRoot').innerHTML =
          '<p style="padding:2rem;">Missing parameters.</p>';
        return;
      }

      const sourceArr = type === 'experience' ? experiences : projects;
      const item = sourceArr.find(p => p.id === id);
      if (!item) {
        document.getElementById('detailRoot').innerHTML =
          '<p style="padding:2rem;">Item not found.</p>';
        return;
      }

      /* build sidebar contents list */
      const contentsList = (item.details?.sections || [])
        .map(s => `<li><a href="#${s.id}">${s.title}</a></li>`).join('');

      /* build main sections */
      const sectionsHTML = (item.details?.sections || [])
        .map(buildSection).join('');

      /* back-link target */
      const backHref = type === 'experience'
        ? 'index.html#experience'
        : 'projects.html';

      /* inject HTML */
      document.getElementById('detailRoot').innerHTML = `
        <nav class="project-nav">
          <a href="${backHref}" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            Back
          </a>
        </nav>

        <div class="project-detail">
          <aside class="project-sidebar">
            <h1 class="project-detail-title">${item.title}</h1>
            <p class="project-detail-subtitle">${item.details?.subtitle || ''}</p>

            <div class="project-info">
              <div class="info-item"><span class="info-label">Date</span><span class="info-value">${item.date || item.year}</span></div>
              <div class="info-item"><span class="info-label">Category</span><span class="info-value">${item.category}</span></div>
              <div class="info-item"><span class="info-label">Tools</span><span class="info-value">${item.tools}</span></div>
            </div>

            <div class="contents"><h3>Contents</h3><ul class="contents-list">${contentsList}</ul></div>
          </aside>

          <main class="project-main">
            <div class="hero-image">${item.logo}</div>
            ${sectionsHTML || `<p class="section-content">${item.description}</p>`}
          </main>
        </div>
      `;

      /* smooth-scroll for sidebar links */
      document.querySelectorAll('.contents-list a').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          const target = document.getElementById(a.getAttribute('href').slice(1));
          if (target) window.scrollTo({ top: target.offsetTop - 80, behavior: 'smooth' });
        });
      });
    });
  </script>
</body>
</html>
